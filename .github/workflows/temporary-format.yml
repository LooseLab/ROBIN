name: One-time Python formatting

on:
  push:
    branches:
      - chore/black-formatting

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install formatters
        run: python -m pip install 'black>=23' 'isort>=5'

      - name: Format ROBIN-owned Python
        run: |
          isort src/robin tests --skip-glob 'src/robin/submodules/*'
          black src/robin tests --exclude 'src/robin/submodules/'

      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/robin tests
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git commit -m 'style: format ROBIN Python with Black and isort'
          git push
