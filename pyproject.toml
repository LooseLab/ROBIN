[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robin"
version = "0.5.4"
description = "Real-time Oxford Nanopore oncology analysis and monitoring workflow"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Matt Loose", email = "matt.loose@nottingham.ac.uk"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
    "alive-progress",
    "argon2-cffi>=23.1.0",
    "click>=8.0.0",
    "cnv_from_bam",
    "cryptography>=41.0.0",
    "dna_features_viewer",
    "docker",
    "gff3_parser",
    "methylartist@git+https://github.com/mattloose/methylartist",
    "natsort",
    "networkx",
    "nicegui>=3.15.0",
    "numpy<2",
    "opencv-python",
    "packaging",
    "pandas>=2.0,<=2.1.4",
    "plotly",
    "polars",
    "psutil",
    "pyarrow>=23.0.1",
    "PyPDF2",
    "pyranges",
    "python-dateutil>=2.8.0",
    "ray[default]>=2.0.0",
    "reportlab",
    "requests",
    "rich",
    "ruptures>=1.1.0",
    "scikit-learn",
    "scipy>=1.11,<1.14",
    "seaborn",
    "sturgeon@git+https://github.com/looselab/sturgeon@testing",
    "tabulate",
    "tomli-w",
    "torch",
    "tqdm>=4.64.0",
    "uvloop<0.22",
    "watchdog>=3.0.0",
    "zxing-cpp<3",
]

[project.optional-dependencies]
# Kept for backwards compatibility with existing `pip install '.[gui]'`
# instructions. NiceGUI is currently also part of the base installation.
gui = [
    "nicegui>=3.15.0",
]
minknow = [
    # Install a minor version matching MinKNOW Core, e.g. pip install 'minknow_api>=6.8.0,<6.9.0'
    "minknow_api>=6.8.0,<7.0.0",
]
marlin = [
    # TensorFlow required to load marlin_v1.model.hdf5 (downloaded on first use).
    # Python 3.12+ only has TF >=2.16 wheels; those default to Keras 3, which does
    # not reliably load the MARLIN Keras-2 HDF5 checkpoint. tf-keras provides the
    # Keras 2 API used at inference time.
    "tensorflow>=2.16",
    "tf-keras>=2.16",
]
lamprey = [
    # Lamprey package itself is NOT listed here (evaluation license; install
    # separately from https://github.com/princessmaximacenter/Lamprey).
    # These deps support ROBIN's Lamprey wrapper + HuggingFace model download.
    "onnxruntime>=1.16",
    "huggingface_hub>=0.20",
    "pyyaml>=6.0",
]
tucan = [
    # Tucan pediatric solid tumor / lymphoma classifier (UMCUGenetics).
    # Model weights download from Hugging Face on first use.
    "tucan@git+https://github.com/UMCUGenetics/tucan.git",
    "huggingface_hub>=0.20",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0",
]
readfish = [
    "readfish[all]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
robin = "robin.cli:main"

[project.urls]
Homepage = "https://looselab.github.io/ROBIN/"
Documentation = "https://looselab.github.io/ROBIN/"
Repository = "https://github.com/LooseLab/ROBIN"
Issues = "https://github.com/LooseLab/ROBIN/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/robin"]

[tool.hatch.build.targets.wheel.force-include]
"src/robin/resources/marlin" = "robin/resources/marlin"

[tool.hatch.metadata]
allow-direct-references = true

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["robin"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=robin",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src/robin"]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
